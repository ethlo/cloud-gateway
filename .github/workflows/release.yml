name: Create and Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and push to GHCR, for example v1.2.3. Empty builds the selected branch.'
        required: false
        default: ''

  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

env:
  # The release tag being built: the pushed tag, or the 'tag' input of a manual run. Empty for branch builds.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  IMAGE_NAME: ghcr.io/ethlo/cloud-gateway

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm  # Free ARM64 runner for public repos
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Point the POM at GHCR
        # Tags from before the move to GHCR name the image ethlocom/... in the POM
        if: inputs.tag != ''
        run: sed -i 's#<name>ethlocom/#<name>ghcr.io/ethlo/#' cloud-gateway-server/pom.xml

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set Version and Tag
        id: set_vars
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            VERSION=$RELEASE_TAG
            VERSION=${VERSION#v}
            DOCKER_TAG=${VERSION}
          else
            VERSION="latest-SNAPSHOT"
            DOCKER_TAG="latest-SNAPSHOT"
          fi
          echo "MAVEN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DOCKER_ARCH_TAG=${DOCKER_TAG}-${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set Project Version
        run: mvn versions:set -DnewVersion=${{ env.MAVEN_VERSION }} -DskipTests

      - name: Build Full Project
        run: mvn -B clean install -DskipTests

      - name: Build Spring Boot Docker Image Locally
        run: |
          mvn -f cloud-gateway-server/pom.xml spring-boot:build-image \
            -DskipTests \
            -Dimage.tag=${DOCKER_ARCH_TAG}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.DOCKER_ARCH_TAG }}

  merge-manifests:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Multi-Arch Manifest
        run: |
          echo "Waiting 30 seconds for images to become available..."
          sleep 30

          if [[ -n "$RELEASE_TAG" ]]; then
            FINAL_TAG="$RELEASE_TAG"
            FINAL_TAG="${FINAL_TAG#v}"
          else
            FINAL_TAG="latest-SNAPSHOT"
          fi

          AMD64_TAG="${{ env.IMAGE_NAME }}:${FINAL_TAG}-amd64"
          ARM64_TAG="${{ env.IMAGE_NAME }}:${FINAL_TAG}-arm64"

          docker manifest create ${{ env.IMAGE_NAME }}:${FINAL_TAG} \
            --amend ${AMD64_TAG} \
            --amend ${ARM64_TAG}

          docker manifest push ${{ env.IMAGE_NAME }}:${FINAL_TAG}

      - name: (Optional) Tag release as 'latest'
        if: env.RELEASE_TAG != ''
        run: |
          FINAL_TAG="$RELEASE_TAG"
          FINAL_TAG="${FINAL_TAG#v}"

          AMD64_TAG="${{ env.IMAGE_NAME }}:${FINAL_TAG}-amd64"
          ARM64_TAG="${{ env.IMAGE_NAME }}:${FINAL_TAG}-arm64"

          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            --amend ${AMD64_TAG} \
            --amend ${ARM64_TAG}
          docker manifest push ${{ env.IMAGE_NAME }}:latest
